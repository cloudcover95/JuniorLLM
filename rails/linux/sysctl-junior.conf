# JuniorOS host knobs. Install to /etc/sysctl.d/90-junior.conf after review.
# Do not apply blindly on a host that needs unprivileged userns for rootless engines.

kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.yama.ptrace_scope = 1
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.tcp_syncookies = 1

# Optional on dedicated inference hosts that never run rootless OCI:
# user.max_user_namespaces = 0
